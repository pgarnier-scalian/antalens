[project]
name = "antalens"
version = "0.0.1"
description = "Interactive scientific visualization engine for tabular and time-series data"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Pierre GARNIER", email = "pierre.garnier@scalian.com" }
]
keywords = ["visualization", "dashboard", "antares", "panel", "plotly"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
]

# Base dependencies — what `pip install antalens` pulls
dependencies = [
    "polars>=0.20",
    "pandas>=2.0",
    "xarray>=2024.1",
    "plotly>=5.18",
    "panel>=1.4",
    "param>=2.0",
    "holoviews>=1.18",
    "hvplot>=0.9",
    "numpy>=1.24",
    "pandas-stubs>=3.0.0.260204",
    "pyarrow>=24.0.0",
]

[project.optional-dependencies]
maps = ["pydeck>=0.9"]
bigdata = ["datashader>=0.16", "dask>=2024.1"]
antares = ["h5py>=3.10", "PyYAML>=6.0"]
mcp = ["fastmcp>=0.2"]
all = [
    "antalens[maps,bigdata,antares,mcp]",
]

[dependency-groups]
# Dev tools — installed via `uv sync`, never shipped to users
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "syrupy>=4.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "sphinx>=7.4",
    "myst-parser>=4.0",
    "furo>=2024.8",
    "sphinx-autobuild>=2024.10",
    "pre-commit>=3.8",
    "ipython>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antalens"]

# ─── ruff ───────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pyflakes + pycodestyle
    "I",             # isort (import sorting)
    "B",             # bugbear (common bugs)
    "UP",            # pyupgrade (modernize syntax)
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "D",             # pydocstyle (docstrings)
]
ignore = [
    "D100",  # missing docstring in public module — too noisy at start
    "D104",  # missing docstring in public package
    "D203",  # 1 blank line before class — conflicts with D211
    "D213",  # multi-line summary on second line — conflicts with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["D"]  # tests don't need docstrings
"docs/**/*" = ["D"]
"examples/**/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# ─── mypy ───────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = false
warn_return_any = true
files = ["src/antalens"]

[[tool.mypy.overrides]]
module = ["plotly.*", "panel.*", "holoviews.*", "hvplot.*", "datashader.*", "pydeck.*", "h5py.*", "param"]
ignore_missing_imports = true

# ─── pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=antalens",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: end-to-end integration tests",
    "perf: performance benchmarks",
]
